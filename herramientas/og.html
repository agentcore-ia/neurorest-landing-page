<!DOCTYPE html>
<html lang="es-AR"><head><meta charset="utf-8"/>
<style>
@font-face { font-family:'Manrope'; font-weight:800; src:url('node_modules/@fontsource/manrope/files/manrope-latin-800-normal.woff2') format('woff2'); }
@font-face { font-family:'DM Sans'; font-weight:500; src:url('node_modules/@fontsource/dm-sans/files/dm-sans-latin-500-normal.woff2') format('woff2'); }
html,body { margin:0; width:1200px; height:630px; }
body { font-family:'DM Sans',sans-serif; color:#1d1d1f; position:relative; overflow:hidden;
  background: radial-gradient(55% 75% at 92% 8%, rgba(255,147,69,.30), transparent 62%),
              radial-gradient(45% 60% at 8% 100%, rgba(255,214,189,.55), transparent 64%),
              linear-gradient(180deg,#ffffff 0%,#fbf7f3 100%); }
.marca { position:absolute; left:80px; top:72px; display:flex; align-items:center; gap:18px; }
.marca img { width:76px; height:79px; border-radius:20px; }
.marca span { font-family:'Manrope'; font-weight:800; font-size:54px; letter-spacing:-2px; }
.kicker { position:absolute; left:80px; top:232px; color:#f25b06; font-weight:500; font-size:22px; letter-spacing:.16em; text-transform:uppercase; }
.kicker::before { content:''; display:inline-block; width:34px; height:3px; background:currentColor; margin:0 16px 6px 0; vertical-align:middle; }
h1 { position:absolute; left:80px; top:272px; margin:0; width:860px; font-family:'Manrope'; font-weight:800; font-size:76px; line-height:1.02; letter-spacing:-3.2px; }
h1 em { font-style:normal; color:#ff6b1a; }
p { position:absolute; left:80px; bottom:66px; margin:0; font-size:27px; color:#5d5d63; }
.mascota { position:absolute; right:-60px; bottom:-90px; width:500px; opacity:.97; }
</style></head>
<body>
  <img class="mascota" src="../capta-mascot.png" alt=""/>
  <div class="marca"><img src="../logo-capta.png" alt=""/><span>Capta</span></div>
  <div class="kicker">Hecho en Argentina</div>
  <h1>Software de gestión gastronómica <em>con IA</em></h1>
  <p>Pedidos · mesas · reservas · delivery · caja · stock · clientes</p>
</body></html>
